<!doctype html>
<!-- Not part of the site: the page scripts/brand.mjs photographs for the share image (og-image.jpg). -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>AFLOAT · imagen para compartir</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(ellipse at 72% 50%, #121a20, #040506 70%); color: #e6e8eb; font-family: 'Barlow Condensed', sans-serif; }
      .card { display: grid; grid-template-columns: 520px 680px; height: 630px; align-items: center; }
      .text { padding: 0 0 0 72px; }
      .logo { display: flex; align-items: center; gap: 18px; color: #f0a030; font-size: 64px; font-weight: 700; letter-spacing: .25em; }
      .logo i { width: 30px; height: 30px; background: #e0443a; transform: rotate(45deg); flex: none; }
      h1 { margin: 26px 0 0; font-size: 52px; line-height: 1.08; font-weight: 700; }
      p { margin: 26px 0 0; font-size: 21px; color: #8e989f; letter-spacing: .04em; }
      .stage { position: relative; width: 680px; height: 630px; overflow: hidden; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .vignette-overlay { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="logo"><i></i>AFLOAT</div>
        <h1 id="tagline"></h1>
        <p id="pitch"></p>
      </div>
      <div class="stage vignette" id="stage"></div>
    </div>
    <script type="module" src="/src/og.ts"></script>
  </body>
</html>
