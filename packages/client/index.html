<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFLOAT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --panel: rgba(12, 14, 16, 0.86);
        --line: #3a4248;
        --text: #e6e8eb;
        --muted: #8e989f;
        --amber: #f0a030;
        --red: #ff4a3a;
        --cyan: #3ec6e0;
        --green: #5dd39e;
      }
      html, body { margin: 0; height: 100%; background: #040506; overflow: hidden; color: var(--text); font-family: 'Barlow Condensed', sans-serif; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; position: absolute; inset: 0; }
      button { font: inherit; color: var(--text); background: #1b2024; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--amber); }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { background: var(--amber); color: #1a1206; border-color: var(--amber); font-weight: 700; letter-spacing: 0.06em; }
      input, select { font: inherit; color: var(--text); background: #11151a; border: 1px solid var(--line); padding: 5px 8px; }
      .muted { color: var(--muted); }

      /* Landing page (over the live ship) */
      #landing { position: fixed; inset: 0; z-index: 15; display: none; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; font-size: 19px; line-height: 1.4; }
      .landing-nav { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: rgba(4, 5, 6, 0.94); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(58, 66, 72, 0.5); }
      .landing-nav button:not(.primary) { background: none; border: none; padding: 6px 4px; color: var(--muted); font-size: 17px; }
      .landing-nav button:not(.primary):hover { color: var(--text); }
      .landing-nav .landing-logo { color: var(--amber) !important; font-weight: 700; letter-spacing: .25em; font-size: 20px !important; }
      .landing-links { display: flex; gap: 14px; flex: 1; flex-wrap: wrap; }
      .landing-github { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 17px; padding: 6px 4px; }
      .landing-github:hover { color: var(--text); }
      .landing-hero { position: relative; min-height: calc(100vh - 56px); display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: center; gap: 24px; padding: 24px max(16px, calc((100vw - 1240px) / 2)) 64px; background: radial-gradient(ellipse at 70% 50%, #10161b, #040506 70%); }
      .landing-hero-text { max-width: 560px; }
      .landing-hero h1 { margin: 0; font-size: clamp(40px, 5vw, 64px); letter-spacing: .25em; color: var(--amber); line-height: 1; }
      .landing-tagline { font-size: clamp(30px, 3.6vw, 46px); line-height: 1.15; font-weight: 600; margin: 18px 0 30px; }
      .landing-cta { font-size: 26px; padding: 10px 44px; }
      .landing-meta { color: var(--muted); letter-spacing: .06em; margin-top: 18px; }
      .landing-hero-stage { height: min(70vh, 640px); }
      .landing-down { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: none !important; border: none !important; font-size: 40px; color: var(--muted); animation: landing-bob 2s ease-in-out infinite; }
      @keyframes landing-bob { 50% { transform: translate(-50%, 6px); } }
      .landing-section { background: #040506; padding: 72px max(16px, calc((100vw - 1160px) / 2)); border-top: 1px solid #14181b; }
      .landing-section h2 { font-size: clamp(32px, 5vw, 46px); margin: 4px 0 14px; letter-spacing: .02em; }
      .landing-section > p { max-width: 760px; }
      .landing-kicker { color: var(--amber); letter-spacing: .2em; font-size: 15px; }
      .vignette { position: relative; overflow: hidden; }
      .vignette canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
      .vignette-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px; gap: 10px; }
      .v-hud { display: flex; align-items: center; gap: 10px; background: rgba(8, 10, 12, 0.82); border: 1px solid var(--line); padding: 6px 12px; font-size: 18px; }
      .v-label { font-size: 14px; letter-spacing: .14em; color: var(--muted); }
      .v-pips { display: flex; gap: 6px; }
      .v-pips i { width: 14px; height: 14px; transform: rotate(45deg); border: 2px solid var(--amber); }
      .v-pips i.on { background: var(--amber); }
      .v-bar { width: 160px; height: 10px; background: #1b2024; border: 1px solid var(--line); }
      .v-bar i { display: block; height: 100%; transition: width .7s ease; }
      .v-bar.oxygen i { background: var(--cyan); }
      .v-bar.hull i { background: #c9b48a; }
      .v-phases span { color: var(--muted); }
      .v-phases span.on { color: var(--amber); font-weight: 700; }
      .v-card { align-self: flex-end; max-width: 300px; background: rgba(8, 10, 12, 0.9); border: 1px solid var(--line); border-left: 4px solid var(--amber); padding: 10px 14px; font-size: 18px; animation: v-card-in .35s ease-out; }
      .v-card p { margin: 4px 0 0; font-size: 16px; color: #c4cacf; }
      @keyframes v-card-in { from { opacity: 0; transform: translateY(-8px); } }
      .slider { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 28px; align-items: center; margin-top: 26px; }
      .slider-stage { height: min(56vh, 480px); min-height: 300px; background: radial-gradient(ellipse at center, #10161b, #040506 72%); border: 1px solid #14181b; }
      .slider-count { color: var(--amber); font-weight: 700; font-size: 28px; letter-spacing: .06em; }
      .slider-text h3 { font-size: clamp(28px, 3vw, 36px); margin: 4px 0 10px; }
      .slider-body { margin: 0; color: #c4cacf; }
      .slider-tip { margin: 10px 0 0; }
      .slider-tip:empty, .slider-kicker:empty { display: none; }
      .slider-nav { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
      .slider-nav .arrow { height: 44px; width: 44px; font-size: 28px; }
      .slider-nav .dots { margin: 0; flex-wrap: wrap; }
      .landing-grid, .landing-crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 20px; }
      .landing-crew { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
      .landing-card { background: #0c0f12; border: 1px solid var(--line); border-top: 4px solid var(--line); padding: 16px 18px; }
      .landing-card h3 { margin: 2px 0 4px; font-size: 24px; }
      .landing-card p { margin: 8px 0 0; }
      .landing-card ul { margin: 10px 0 0; padding-left: 20px; }
      .landing-crew img { width: 100%; aspect-ratio: 1; display: block; margin-bottom: 10px; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); }
      .landing-crew p { font-size: 17px; color: #c4cacf; }
      .landing-card.role-engineer { border-top-color: #e8a33a; }
      .landing-card.role-medic { border-top-color: #e9e9e9; }
      .landing-card.role-soldier { border-top-color: #6f9440; }
      .landing-card.role-hacker { border-top-color: #4aa3e0; }
      .landing-card.role-diver { border-top-color: #1fb5a5; }
      .landing-item { border-top-color: var(--amber); }
      .landing-item img { width: 110px; height: 110px; display: block; background: radial-gradient(circle at 50% 45%, #2c353d, #0b0e10 72%); }
      .landing-item .muted { font-size: 17px; }
      .landing-strong { font-weight: 600; color: var(--amber); }
      .landing-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .landing-tags span { font-size: 14px; letter-spacing: .06em; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
      .landing-event { border-top-color: var(--red); }
      .landing-event.event-calm { border-top-color: var(--green); }
      .ranking { margin-top: 20px; max-width: 760px; }
      .ranking-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
      .ranking-tabs button.on { border-color: var(--amber); color: var(--amber); }
      .ranking-table { width: 100%; border-collapse: collapse; }
      .ranking-table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 15px; letter-spacing: .06em; padding: 6px 10px; border-bottom: 1px solid var(--line); }
      .ranking-table td { padding: 8px 10px; border-bottom: 1px solid #14181b; }
      .ranking-table td:first-child { color: var(--amber); font-weight: 700; width: 3em; }
      .ranking-table td:nth-child(3) { font-weight: 700; }
      .ranking-table tr.me td { background: rgba(240, 160, 48, 0.1); }
      .ranking-table tr.gap td { color: var(--muted); text-align: center; padding: 2px; }
      .end-ranking { margin: 10px 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid var(--amber); }
      .end-ranking em { color: var(--amber); font-style: normal; font-weight: 700; font-size: 22px; }
      .lobby-ranked { margin: 8px 0 0; color: var(--muted); }
      .lobby-ranked.on { color: var(--green); }
      .landing-footer { background: #040506; border-top: 1px solid #14181b; padding: 48px 16px 64px; text-align: center; }
      .landing-footer a { color: var(--amber); }
      .row-group { display: flex; gap: 10px; }
      @media (max-width: 900px) {
        .landing-hero { grid-template-columns: 1fr; text-align: center; padding-top: 36px; }
        .landing-hero-text { max-width: none; }
        .landing-hero-stage { height: 46vh; min-height: 260px; }
        .slider { grid-template-columns: 1fr; }
        .slider-stage { height: 44vh; }
      }
      @media (max-width: 720px) {
        .landing-links, .landing-github span { display: none; }
        .landing-nav { justify-content: space-between; padding: 8px 16px; }
        .landing-section { padding-top: 52px; padding-bottom: 52px; }
      }

      /* Setup and dialogs */
      #setup, #dialog { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(2, 3, 4, 0.82); z-index: 20; }
      .setup, .panel { background: var(--panel); border: 1px solid var(--line); padding: 28px 32px; width: min(720px, 92vw); font-size: 18px; }
      .setup h1 { margin: 0; font-size: 46px; letter-spacing: 0.25em; color: var(--amber); }
      .setup label { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
      .setup-rows { display: grid; gap: 8px; margin: 10px 0 16px; }
      .setup-row { display: grid; grid-template-columns: 150px auto 1fr 26px; gap: 12px; align-items: center; }
      .picks { display: flex; gap: 4px; }
      .pick { width: 46px; height: 46px; padding: 0; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); border: 2px solid transparent; }
      .pick img { width: 100%; height: 100%; display: block; }
      .pick.selected { border-color: var(--amber); }
      .pick:disabled { opacity: .2; }
      .chosen { display: flex; flex-direction: column; line-height: 1.1; }
      .setup-row .info { position: static; }

      /* Setup wizard */
      .setup.wizard { width: min(860px, 94vw); }
      .setup.wizard.narrow { width: min(480px, 94vw); }
      .setup.wizard h2 { margin: 4px 0 14px; font-size: 30px; letter-spacing: .04em; }
      .setup .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 18px; }
      .setup .row.end { justify-content: flex-end; }
      .counts { display: flex; gap: 12px; }
      .count { width: 84px; height: 84px; font-size: 40px; font-weight: 700; }
      .count.selected { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
      .carousel { display: grid; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: center; }
      .arrow { height: 120px; font-size: 40px; padding: 0; }
      .slide { display: grid; grid-template-columns: 230px 1fr; gap: 20px; border-top: 4px solid var(--amber); padding-top: 14px; min-height: 300px; }
      .slide.role-engineer, .strip-card.role-engineer { border-top-color: #e8a33a; }
      .slide.role-medic, .strip-card.role-medic { border-top-color: #e9e9e9; }
      .slide.role-soldier, .strip-card.role-soldier { border-top-color: #6f9440; }
      .slide.role-hacker, .strip-card.role-hacker { border-top-color: #4aa3e0; }
      .slide.role-diver, .strip-card.role-diver { border-top-color: #1fb5a5; }
      .slide h2 { margin: 2px 0 0 !important; }
      .slide ul { margin: 0; padding-left: 20px; }
      .dots { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
      .dot { width: 12px; height: 12px; padding: 0; border-radius: 50%; }
      .dot.on { background: var(--amber); border-color: var(--amber); }
      .name-step { display: flex; gap: 14px; align-items: center; margin: 8px 0 14px; }
      .name-step img { width: 96px; height: 96px; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); }
      .name-step h2 { margin: 0 !important; }
      .name-label { display: grid !important; gap: 6px; }
      .name-label input { font-size: 22px; }
      .crew-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
      .strip-card { display: grid; justify-items: center; gap: 2px; width: 140px; padding: 10px 6px; background: #11151a; border: 1px solid var(--line); border-top: 4px solid var(--line); text-align: center; line-height: 1.15; }
      .strip-card img { width: 100px; height: 100px; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); margin-bottom: 4px; }
      /* Play menu and online waiting room */
      .play-menu .mode { display: grid; gap: 2px; width: 100%; text-align: left; padding: 14px 18px; margin-bottom: 10px; background: #11151a; }
      .play-menu .mode b { font-size: 24px; }
      .play-menu .mode span { color: var(--muted); }
      .code-input { font-size: 30px !important; letter-spacing: .3em; text-transform: uppercase; }
      .setup.lobby { width: min(920px, 94vw); max-height: 92vh; overflow-y: auto; }
      .setup.lobby h3 { margin: 18px 0 8px; font-size: 22px; }
      .lobby-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
      .lobby-code { font-size: 48px; font-weight: 700; letter-spacing: .3em; color: var(--amber); line-height: 1.1; }
      .lobby-seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
      .lobby-seat { position: relative; display: flex; gap: 10px; align-items: center; background: #11151a; border: 1px solid var(--line); border-left: 4px solid var(--line); padding: 8px; }
      .lobby-seat img, .lobby-empty { width: 52px; height: 52px; flex: none; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); display: grid; place-items: center; color: var(--muted); font-size: 24px; }
      .lobby-seat.role-engineer, .lobby-role.role-engineer { border-left-color: #e8a33a; }
      .lobby-seat.role-medic, .lobby-role.role-medic { border-left-color: #e9e9e9; }
      .lobby-seat.role-soldier, .lobby-role.role-soldier { border-left-color: #6f9440; }
      .lobby-seat.role-hacker, .lobby-role.role-hacker { border-left-color: #4aa3e0; }
      .lobby-seat.role-diver, .lobby-role.role-diver { border-left-color: #1fb5a5; }
      .lobby-remove { position: absolute; top: 4px; right: 4px; padding: 0 8px; }
      .lobby-roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .lobby-role { display: grid; justify-items: center; gap: 2px; padding: 8px; border-left: 4px solid var(--line); line-height: 1.15; }
      .lobby-role img { width: 64px; height: 64px; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); }
      .lobby-role.selected { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
      .lobby-bots { display: flex; flex-wrap: wrap; gap: 8px; }
      .lobby-name { max-width: 360px; }
      .lobby-status { flex: 1; text-align: center; }
      .levels .level:disabled { opacity: .7; }
      .bot-turn button { margin-left: 10px; }
      #menu-button { margin-left: 8px; pointer-events: auto; font-size: 15px; padding: 4px 12px; }

      /* Modals: character sheet, item sheet, item found, turn popup */
      #sheet { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(2, 3, 4, 0.78); z-index: 40; }
      .modal { position: relative; width: min(760px, 92vw); background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--amber); padding: 24px; font-size: 18px; }
      .modal.small { width: min(460px, 92vw); }
      .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
      .level { display: grid; gap: 4px; text-align: left; padding: 10px 12px; font-size: 15px; }
      .level b { font-size: 20px; letter-spacing: .06em; }
      .level span { color: var(--muted); font-size: 14px; }
      .level em { font-style: normal; color: var(--amber); font-size: 14px; }
      .level.selected { border-color: var(--amber); background: rgba(240, 160, 48, .12); }
      .panel .score-mult { display: flex; justify-content: space-between; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--amber); font-size: 16px; }
      .modal.wide { width: min(980px, 94vw); }
      .records table { width: 100%; border-collapse: collapse; font-size: 16px; margin: 10px 0 14px; }
      .records th { text-align: left; color: var(--muted); font-weight: normal; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid var(--line); }
      .records td { padding: 7px 8px; border-bottom: 1px solid rgba(58, 66, 72, .5); vertical-align: top; }
      .records td b { color: var(--amber); font-size: 19px; }
      .records td.won { color: var(--green); }
      .records td.lost { color: var(--red); }
      .records tr.mine td { background: rgba(240, 160, 48, .12); }
      .records > p.muted { font-size: 14px; }
      .turn-popup .round-line b.good { color: var(--green); }
      .panel .score { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
      .panel .score-total { display: flex; align-items: baseline; gap: 14px; }
      .panel .score-total span { color: var(--muted); letter-spacing: .12em; font-size: 14px; }
      .panel .score-total b { font-size: 40px; color: var(--amber); }
      .panel .score-total em { font-style: normal; color: var(--green); }
      .panel .score table { width: 100%; border-collapse: collapse; font-size: 16px; margin-top: 6px; }
      .panel .score td { padding: 3px 0; }
      .panel .score td:nth-child(2) { text-align: right; padding-right: 18px; }
      .panel .score td:last-child { text-align: right; width: 70px; color: var(--green); }
      .panel .score td.neg { color: var(--red) !important; }
      .modal-close { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; font-size: 26px; color: var(--muted); padding: 2px 8px; }
      .modal h2 { margin: 2px 0 0; font-size: 32px; letter-spacing: .04em; }
      .modal h3 { margin: 14px 0 4px; font-size: 16px; letter-spacing: .1em; color: var(--amber); }
      .modal ul { margin: 0; padding-left: 20px; }
      .modal .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 18px; }
      .sheet { display: grid; grid-template-columns: 240px 1fr; gap: 22px; }
      .sheet.role-engineer { border-top-color: #e8a33a; }
      .sheet.role-medic { border-top-color: #e9e9e9; }
      .sheet.role-soldier { border-top-color: #6f9440; }
      .sheet.role-hacker { border-top-color: #4aa3e0; }
      .sheet.role-diver { border-top-color: #1fb5a5; }
      .sheet.item { border-top-color: var(--cyan); grid-template-columns: 200px 1fr; }
      .sheet-photo { background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); align-self: start; }
      .sheet-photo img { width: 100%; display: block; }
      .sheet-kicker { font-size: 14px; letter-spacing: .14em; color: var(--muted); }
      .sheet-story { line-height: 1.35; color: #cfd5da; }
      .sheet-effect { font-size: 22px; color: var(--cyan); margin: 6px 0 10px; }
      .sheet-lives { margin-top: 10px; }
      .found { text-align: center; }
      .found img { width: 180px; height: 180px; display: block; margin: 8px auto; background: radial-gradient(circle at 50% 45%, #34404a, #0b0e10 75%); }
      .found p { color: var(--cyan); font-size: 20px; margin: 6px 0 16px; }
      .turn-popup .round-line { display: flex; gap: 10px; align-items: baseline; margin: 8px 0; font-size: 20px; }
      .turn-popup .round-line b { color: var(--cyan); }
      .turn-popup .round-line b.hull { color: #e0c48a; }
      .modal .row.end { justify-content: flex-end; }
      .guide p { line-height: 1.35; color: #cfd5da; }
      .guide ul { line-height: 1.35; color: #cfd5da; display: grid; gap: 4px; }
      .guide .tip { color: var(--cyan); border-left: 3px solid var(--cyan); padding-left: 10px; }
      .guide-modal { border-top-color: var(--cyan); }
      .setup .check { margin: 10px 0; }
      .round-event { display: grid; gap: 2px; padding: 8px 10px; border-left: 3px solid var(--line); background: #11151a; margin-bottom: 14px; }
      .round-event.alert { border-left-color: var(--red); }
      .round-event.alert b { color: #ffb0a8; }
      .turn-who { display: flex; gap: 14px; align-items: center; }
      .turn-who img { width: 84px; height: 84px; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); }
      .setup-error { color: var(--red); min-height: 1em; }
      .panel h2 { margin-top: 0; letter-spacing: 0.1em; }
      .panel .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
      .panel .check { display: block; margin: 6px 0; }
      .panel .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .panel.end.won h2 { color: var(--green); }
      .panel.end.lost h2 { color: var(--red); }

      /* HUD */
      #hud-top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 24px; align-items: center; padding: 8px 16px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); font-size: 18px; pointer-events: none; z-index: 5; }
      #hud-top .turn { white-space: nowrap; letter-spacing: 0.05em; }
      .pips { margin-left: 8px; }
      .pip { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border: 1px solid var(--amber); transform: rotate(45deg); }
      .pip.on { background: var(--amber); }
      .oxygen { display: flex; align-items: center; gap: 8px; }
      .oxygen .bar { width: 150px; height: 12px; border: 1px solid var(--line); background: #0b0e10; }
      .oxygen .bar div { height: 100%; background: var(--cyan); transition: width .6s; }
      .oxygen.low .bar div { background: var(--red); animation: blink 1s infinite; }
      .oxygen.hull .bar div { background: #c9b48a; }
      .oxygen.hull.low .bar div { background: var(--red); }
      #hud-top { gap: 20px; }
      @keyframes blink { 50% { opacity: .45; } }
      .systems { display: flex; gap: 12px; margin-left: auto; font-size: 16px; }
      .sys { color: var(--muted); white-space: nowrap; }
      .sys b { color: var(--text); }
      .sys.done b { color: var(--green); }

      #crew-panel { position: fixed; left: 12px; top: 50px; display: flex; gap: 8px; align-items: flex-start; z-index: 5; }
      .crew-card { background: var(--panel); border: 1px solid var(--line); border-bottom: 3px solid var(--line); padding: 6px; font-size: 16px; }
      .crew-card.mini { width: 72px; cursor: pointer; text-align: center; font: inherit; color: inherit; }
      .crew-card.turn { box-shadow: 0 0 0 2px var(--amber); }
      .crew-card.active { position: relative; padding-right: 30px; }
      .crew-card.active .info { position: absolute; top: 6px; right: 6px; bottom: auto; }
      .turn-tag { background: var(--amber); color: #1a1206; }
      .bot-tag { background: #1d3340; color: var(--cyan); }
      .crew-card.mini .bot-tag { display: block; margin: 3px 0 0; font-size: 11px; }
      .bot-turn { font-size: 18px; color: var(--cyan); padding: 6px 2px; }
      .control-pick { display: flex; gap: 0; margin: 4px 0 12px; }
      .control-pick button { flex: 1; padding: 8px; }
      .control-pick button.selected { border-color: var(--amber); color: var(--amber); background: #2a2114; }
      button.item { font: inherit; font-size: 13px; padding: 1px 6px; cursor: pointer; }
      button.item:hover { border-color: var(--cyan); color: var(--cyan); }
      #actions button.special { border-color: var(--cyan); background: #10252b; }
      #actions button.special span { color: #bff0fa; }
      #actions button.special kbd { border-color: var(--cyan); color: var(--cyan); }
      kbd { display: inline-block; min-width: 16px; padding: 0 4px; margin-right: 6px; border: 1px solid var(--muted); color: var(--muted); font: inherit; font-size: 12px; text-align: center; line-height: 16px; }
      .crew-card.mini:hover { border-color: var(--amber); }
      .crew-card.mini .tag { display: block; margin: 3px 0 0; font-size: 11px; padding: 1px 2px; }
      .crew-card.active { display: flex; gap: 10px; width: 320px; }
      .crew-card.out { opacity: .55; }
      .crew-card.role-engineer { border-bottom-color: #e8a33a; }
      .crew-card.role-medic { border-bottom-color: #e9e9e9; }
      .crew-card.role-soldier { border-bottom-color: #6f9440; }
      .crew-card.role-hacker { border-bottom-color: #4aa3e0; }
      .crew-card.role-diver { border-bottom-color: #1fb5a5; }
      .photo { position: relative; flex: none; width: 58px; height: 58px; background: radial-gradient(circle at 50% 38%, #34404a, #0b0e10 75%); }
      .crew-card.active .photo { width: 84px; height: 84px; }
      .photo img { width: 100%; height: 100%; display: block; }
      .info { width: 22px; height: 22px; padding: 0; border-radius: 50%; font-weight: 700; font-size: 14px; line-height: 20px; text-align: center; background: #1b2024; border-color: var(--amber); color: var(--amber); }
      .mini-hearts { margin-top: 4px; line-height: 8px; }
      .mini-hearts .heart { width: 7px; height: 7px; margin-right: 2px; }
      .crew-card .details { min-width: 0; }
      .crew-card .name { font-weight: 700; font-size: 18px; }
      .crew-card .where { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
      .heart { display: inline-block; width: 10px; height: 10px; margin-right: 3px; background: #44403e; transform: rotate(45deg); }
      .heart.on { background: #e0443a; }
      .tag { font-size: 13px; padding: 1px 6px; margin-left: 4px; text-transform: uppercase; letter-spacing: .06em; }
      .tag.ok { background: #1f4a37; color: var(--green); }
      .tag.bad { background: #4a2a1f; color: var(--amber); }
      .tag.dead { background: #3a1414; color: var(--red); }
      .items { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
      .item { font-size: 13px; padding: 1px 6px; border: 1px solid var(--line); background: #151a1e; }

      #actions { position: fixed; left: 12px; right: 356px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; z-index: 5; }
      .actions-title { width: 100%; font-size: 14px; letter-spacing: .1em; color: var(--amber); }
      #actions button, #menu button { display: grid; grid-template-columns: auto 1fr; align-items: center; text-align: left; min-width: 120px; column-gap: 2px; }
      #actions button small, #menu button small { grid-column: 2; color: var(--muted); font-size: 13px; }

      #log { position: fixed; right: 12px; bottom: 10px; width: 330px; background: var(--panel); border: 1px solid var(--line); z-index: 6; display: flex; flex-direction: column; }
      #log.open { height: 50vh; }
      .log-head { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 8px 10px; text-align: left; }
      .log-title { color: var(--amber); font-size: 14px; letter-spacing: .1em; flex: none; }
      .log-last { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 15px; }
      #log.open .log-last { visibility: hidden; }
      .chevron { flex: none; color: var(--amber); font-size: 16px; }
      .log-body { display: none; overflow-y: auto; padding: 0 10px 8px; font-size: 15px; line-height: 1.3; }
      #log.open .log-body { display: block; flex: 1; }
      .log-body div { padding: 2px 0; color: #b9c0c5; }
      .log-body div.new { color: var(--text); }
      .log-body div.alert { color: var(--red); }
      .log-body div.round { color: var(--amber); margin-top: 6px; letter-spacing: .08em; }

      #menu { position: fixed; display: none; background: var(--panel); border: 1px solid var(--amber); padding: 6px; z-index: 15; width: 260px; }
      #menu button { width: 100%; margin-top: 4px; }
      .menu-title { font-size: 14px; letter-spacing: .1em; color: var(--amber); text-transform: uppercase; }

      #toasts { position: fixed; top: 50px; right: 12px; width: 340px; display: grid; gap: 6px; pointer-events: none; z-index: 12; }
      .toast { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); padding: 8px 12px; transition: opacity .5s, transform .5s; animation: toast-in .25s ease-out; }
      @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } }
      .toast img { width: 46px; height: 46px; flex: none; background: radial-gradient(circle at 50% 45%, #34404a, #0b0e10 75%); }
      .toast-title { font-size: 18px; font-weight: 600; letter-spacing: .03em; }
      .toast-text { font-size: 15px; color: var(--muted); }
      .toast.toast-ok { border-left-color: var(--green); }
      .toast.toast-fail { border-left-color: var(--amber); }
      .toast.toast-alert { border-left-color: var(--red); }
      .toast.toast-alert .toast-title { color: #ffb0a8; }
      .toast.toast-error { border-left-color: var(--amber); }
      .toast.toast-error .toast-title { color: var(--amber); }
      .toast.gone { opacity: 0; transform: translateX(20px); }

      #tooltip { position: fixed; display: none; pointer-events: none; padding: 4px 9px; background: rgba(10, 12, 14, 0.9); border: 1px solid #4f585f; font-size: 15px; z-index: 30; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud-top"></div>
    <div id="crew-panel"></div>
    <div id="actions"></div>
    <div id="log"></div>
    <div id="toasts"></div>
    <div id="menu"></div>
    <div id="tooltip"></div>
    <div id="landing"></div>
    <div id="setup"></div>
    <div id="dialog"></div>
    <div id="sheet"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
